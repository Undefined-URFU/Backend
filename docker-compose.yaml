version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cosmetics-postgres
    environment:
      POSTGRES_DB: CosmeticsDatabase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - cosmetics_data:/var/lib/postgresql/data
    networks:
      - cosmetics-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cosmetics-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=postgres;Port=5432;Database=CosmeticsDatabase;User ID=postgres;Password=postgres;Include Error Detail=true"
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cosmetics-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/healthcheck/check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  cosmetics_data:

networks:
  cosmetics-network:
    driver: bridge